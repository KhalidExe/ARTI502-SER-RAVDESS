# One-factor-at-a-time grids around the approved defaults (DECISIONS D-10).
# Selection uses VALIDATION UAR only; the test fold is never evaluated during the search.
rounds: "0-5"
seeds: "0"

m1:
  train.lr: [5.0e-4, 1.0e-3, 2.0e-3]
  model.dropout: [0.2, 0.3, 0.5]
  model.hidden: [64, 128, 256]

m2:
  train.lr: [5.0e-4, 1.0e-3, 2.0e-3]
  model.dropout: [0.2, 0.3, 0.5]
  model.hidden: [64, 128, 256]

m3:
  train.lr: [2.5e-4, 5.0e-4, 1.0e-3]
  model.dropout: [0.1, 0.2, 0.3]
  model.n_layers: [2, 4, 6]
  model.n_heads: [2, 4, 8]

m4:                       # expensive: run on a subset of rounds, e.g. --rounds 0,3
  train.lr: [1.0e-5, 3.0e-5, 5.0e-5]
